services:
  zigbee2mqtt:
    container_name: redeye-zigbee2mqtt
    image: ghcr.io/koenkk/zigbee2mqtt
    restart: unless-stopped
    volumes:
      - ./zigbee2mqtt/data:/app/data
      - /run/udev:/run/udev:ro
    ports:
      # TODO: only use this for development, remove when dashboard is ready
      - 8080:8080
    environment:
      - TZ=Europe/Brussels
    devices:
      - ${ZIGBEE_GATEWAY_PATH}:${ZIGBEE_GATEWAY_PATH}
    group_add:
      - dialout
    user: 1001:1001

  dashboard:
    container_name: redeye-dashboard
    build: ./dashboard
    restart: unless-stopped
    ports:
      - 3000:3000

  backend:
    container_name: redeye-backend
    build: ./backend
    restart: unless-stopped
    depends_on:
      - mosquitto
    ports:
      - 3001:3001
    volumes:
      - ./backend/data:/app/data
      - ./backend/photos:/app/photos

  mosquitto:
    container_name: redeye-mosquitto
    image: eclipse-mosquitto
    restart: unless-stopped
    ports:
      - 1883:1883
    volumes:
      - ./mosquitto/config:/mosquitto/config
